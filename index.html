const T={

en:{title:"PM2.5 and air quality in Tirana",h1:"PM2.5 concentration and air quality in Tirana",sub:"Daily PM2.5 measurements from monitoring stations, November 2025 to June 2026, compared with WHO and EU thresholds.",
stH:"Stations",thesis:"Thesis stations",optional:"Optional stations (dashed lines)",sumH:"Summary by station",

dayH:"Daily PM2.5",dayP:"Shaded bands show the 6 air-quality categories used in the study (Good to Extremely poor).",

cat0:"Good (0–10 µg/m³)",cat1:"Satisfactory (10.1–20 µg/m³)",cat2:"Moderate (20.1–25 µg/m³)",cat3:"Poor (25.1–50 µg/m³)",cat4:"Very poor (50.1–75 µg/m³)",cat5:"Extremely poor (above 75 µg/m³)",

const $=id=>document.getElementById(id);
const WHO_D=15,EU_D=25,WHO_A=5,EU_A=10;
const CATS=[[0,10,"--c0"],[10,20,"--c1"],[20,25,"--c2"],[25,50,"--c3"],[50,75,"--c4"],[75,Infinity,"--c5"]];
let lang="sq",dl=null;
try{const l=localStorage.getItem("lang");if(l==="sq"||l==="en")lang=l;}catch(e){}
const t=k=>T[lang][k];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const f=n=>n.toFixed(1);
const C=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const col=i=>C("--s"+i);
const dayKey=(k,n)=>new Date(Date.parse(k)+n*864e5).toISOString().slice(0,10);

const series=DATA.map((d,i)=>{const days=[];d.v.forEach((v,j)=>{if(v!==null){const k=dayKey(d.s,j);days.push({k,t:Date.parse(k),v});}});return{i,name:d.n,opt:!!d.o,note:d.note,days};});
const sel=new Set(series.filter(s=>!s.opt).map(s=>s.i));
const visible=()=>series.filter(s=>sel.has(s.i));

function buildChips(){
  const mk=s=>`<label class="chip"><input type="checkbox" data-i="${s.i}"${sel.has(s.i)?" checked":""}><span class="sw${s.opt?" dash":""}" style="color:var(--s${s.i})"></span>${esc(s.name)}</label>`;
  $("chipsMain").innerHTML=series.filter(s=>!s.opt).map(mk).join("");
  $("chipsOpt").innerHTML=series.filter(s=>s.opt).map(mk).join("");
}
function stat(s){
  const v=s.days.map(x=>x.v),n=v.length,pk=s.days.reduce((a,b)=>b.v>a.v?b:a);
  return{n,mean:avg(v),pk,a:v.filter(x=>x>WHO_D).length,b:v.filter(x=>x>EU_D).length,first:s.days[0].k,last:s.days[n-1].k};
}
function render(){
  const vis=visible();
  $("stats").innerHTML=vis.length?vis.map(s=>{const z=stat(s),n=z.n;
    return `<tr><th scope="row">${esc(s.name)}</th><td>${z.first} – ${z.last}</td><td>${n}</td><td>${f(z.mean)}</td><td>${f(z.pk.v)} (${z.pk.k})</td><td>${z.a} (${Math.round(100*z.a/n)}%)</td><td>${z.b} (${Math.round(100*z.b/n)}%)</td></tr>`;}).join("")
    :`<tr><td colspan="7" class="empty">${t("none")}</td></tr>`;
  $("notes").innerHTML=vis.filter(s=>s.note).map(s=>`<li><b>${esc(s.name)}</b>: ${esc(s.note[lang])}</li>`).join("");
  if(!vis.length){$("line").innerHTML=$("bars").innerHTML=`<p class="empty" style="margin:0">${t("none")}</p>`;return;}
  lineChart(vis);barChart(vis);
}
function tick(max){const s=max>120?40:max>60?20:10;const r=[];for(let v=0;v<=max;v+=s)r.push(v);return r;}

function lineChart(vis){
  const W=900,H=340,L=46,R=12,T0=12,B=30;
  const all=vis.flatMap(s=>s.days);
  const max=Math.max(30,...all.map(x=>x.v))*1.08;
  const t0=Math.min(...all.map(x=>x.t)),t1=Math.max(...all.map(x=>x.t));
  const X=tt=>L+(t1===t0?(W-L-R)/2:(tt-t0)/(t1-t0)*(W-L-R));
  const Y=v=>T0+(1-v/max)*(H-T0-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("ariaL")}">`;
  CATS.forEach(([lo,hi,cv])=>{
    if(lo>=max)return;
    const yTop=Y(Math.min(hi,max)),yBot=Y(lo);
    s+=`<rect x="${L}" y="${yTop}" width="${W-L-R}" height="${yBot-yTop}" fill="${C(cv)}"/>`;
  });
  for(const v of tick(max))s+=`<text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  const months=[...new Set(all.map(x=>x.k.slice(0,7)))].sort();
  months.forEach(m=>{s+=`<text x="${X(Math.max(t0,Date.parse(m+"-01")))}" y="${H-8}" text-anchor="${m===months[0]?"start":"middle"}">${m}</text>`;});
  vis.forEach(sr=>{
    const segs=[];let cur=[];
    sr.days.forEach((p,j)=>{if(j&&p.t-sr.days[j-1].t>864e5){segs.push(cur);cur=[];}cur.push(p);});segs.push(cur);
    const dash=sr.opt?' stroke-dasharray="6 4"':"";
    segs.forEach(g=>{
      if(g.length===1)s+=`<circle cx="${X(g[0].t)}" cy="${Y(g[0].v)}" r="3" fill="${col(sr.i)}"><title>${esc(sr.name)} ${g[0].k}: ${f(g[0].v)} µg/m³</title></circle>`;
      else s+=`<polyline fill="none" stroke="${col(sr.i)}" stroke-width="1.8" stroke-linejoin="round"${dash} points="${g.map(p=>X(p.t)+","+Y(p.v)).join(" ")}"/>`;
    });
    if(vis.length===1)s+=sr.days.map(p=>`<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="2.5" fill="${col(sr.i)}"><title>${p.k}: ${f(p.v)} µg/m³</title></circle>`).join("");
  });
  $("line").innerHTML=s+"</svg>";
}
function monthly(sr){const m={};for(const p of sr.days)(m[p.k.slice(0,7)]??=[]).push(p.v);return m;}
function barChart(vis){
  const W=900,H=280,L=46,R=12,T0=12,B=30;
  const mm=vis.map(monthly);
  const keys=[...new Set(mm.flatMap(m=>Object.keys(m)))].sort();
  const max=Math.max(12,...mm.flatMap(m=>Object.values(m).map(avg)))*1.1,Y=v=>T0+(1-v/max)*(H-T0-B),bw=(W-L-R)/keys.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("ariaB")}">`;
  for(const v of tick(max))s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${C("--line")}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  keys.forEach((k,g)=>{
    const w=bw*.8/vis.length,x0=L+g*bw+bw*.1;
    vis.forEach((sr,j)=>{const d=mm[j][k];if(!d)return;const a=avg(d);
      s+=`<rect x="${x0+j*w}" y="${Y(a)}" width="${w}" height="${Y(0)-Y(a)}" fill="${col(sr.i)}"><title>${esc(sr.name)}, ${k}: ${f(a)} µg/m³ (${d.length})</title></rect>`;});
    s+=`<text x="${L+g*bw+bw/2}" y="${H-8}" text-anchor="middle">${k}</text>`;
  });
  for(const [v,lab] of [[WHO_A,"WHO 5"],[EU_A,"EU 10"]])s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${C("--red")}" stroke-dasharray="6 4" stroke-width="1.5"/><text x="${W-R-4}" y="${Y(v)-4}" text-anchor="end" style="fill:${C("--red")}">${lab}</text>`;
  $("bars").innerHTML=s+"</svg>";
}

const bytes=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
function buildFiles(){
  const mk=(x,i)=>`<button data-f="${i}"${DATA[i].o?' class="ghost"':""}>${esc(x.n)} <span style="opacity:.75">(${Math.round(x.b.length*.75/1024)} KB)</span></button>`;
  $("filesMain").innerHTML=FILES.map((x,i)=>DATA[i].o?"":mk(x,i)).join("");
  $("filesOpt").innerHTML=FILES.map((x,i)=>DATA[i].o?mk(x,i):"").join("");
}
async function save(i){
  if(!dl)return;
  try{await dl.save({filename:FILES[i].f,data:bytes(FILES[i].b)});$("dlmsg").textContent=t("saved");}
  catch(e){$("dlmsg").textContent=e&&e.code==="declined"?"":t("failed");}
}
function setLang(l){
  lang=l;try{localStorage.setItem("lang",l);}catch(e){}
  document.documentElement.lang=l;document.title=t("title");
  document.querySelectorAll("[data-i]").forEach(el=>{if(T[l][el.dataset.i]!==undefined)el.textContent=T[l][el.dataset.i];});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  $("dlmsg").textContent="";render();
}
document.querySelector(".lang").onclick=e=>{const b=e.target.closest("button");if(b)setLang(b.dataset.l);};
$("chips").onchange=e=>{const i=+e.target.dataset.i;e.target.checked?sel.add(i):sel.delete(i);$("dlmsg").textContent="";render();};
$("dl").onclick=e=>{const b=e.target.closest("button");if(b)save(+b.dataset.f);};
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",render);
buildChips();buildFiles();setLang(lang);
dl={save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data]));a.download=filename;document.body.appendChild(a);a.click();a.remove();}};$("dl").hidden=false;
</script>
